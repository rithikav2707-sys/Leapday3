<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBite | Food Ordering</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --primary: #ff7a18;
            --primary-dark: #e65c00;
            --text: #1b1d21;
            --muted: #6b7280;
            --line: #e5e7eb;
            --success: #16a34a;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff7ed, #f5f7fb);
            color: var(--text);
        }

        .topbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand span { color: var(--primary); }

        .nav {
            display: flex;
            gap: 18px;
            color: #d1d5db;
            font-size: 0.9rem;
        }

        .page {
            max-width: 1300px;
            margin: 28px auto;
            padding: 0 20px 40px;
        }

        .hero {
            background: linear-gradient(135deg, #1f2937, #111827);
            color: white;
            border-radius: 22px;
            padding: 34px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 26px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 2.5rem;
        }

        .hero p {
            margin: 0;
            color: #d1d5db;
            font-size: 1rem;
        }

        .hero-badge {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 600;
        }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(17, 24, 39, 0.04);
        }

        .panel h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.4rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .food-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: 0.2s ease;
        }

        .food-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 18px rgba(17, 24, 39, 0.08);
        }

        .food-image {
            height: 120px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffedd5, #fed7aa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .food-name {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .add-btn, .place-btn, .status-btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 11px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .add-btn:hover, .place-btn:hover, .status-btn:hover { background: var(--primary-dark); }

        .cart-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: white;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .totals {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin: 14px 0 18px;
            font-size: 1.1rem;
        }

        .checkout-form {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }

        .checkout-form input,
        .checkout-form select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            font-size: 0.96rem;
        }

        .order-list {
            margin-top: 18px;
            display: grid;
            gap: 10px;
        }

        .order-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            background: #fafafa;
        }

        .order-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            background: #fff7ed;
            color: var(--primary-dark);
        }

        .muted { color: var(--muted); }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .hero { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand">Fresh<span>Bite</span></div>
    <div class="nav">
        <span>Menu</span>
        <span>Orders</span>
        <span>Contact</span>
    </div>
</div>

<div class="page">
    <section class="hero">
        <div>
            <h1>Good food, fast delivery.</h1>
            <p>Fresh meals, quick service, and a smooth ordering experience.</p>
        </div>
        <div class="hero-badge">Live Order Tracking</div>
    </section>

    <div class="layout">
        <section class="panel">
            <h2>Featured Menu</h2>
            <div class="menu-grid" id="menuGrid"></div>
        </section>

        <aside class="panel">
            <h2>Your Cart</h2>
            <ul class="cart-list" id="cartList"></ul>

            <div class="totals">
                <span>Total</span>
                <span id="totalPrice">₹0</span>
            </div>

            <div class="checkout-form">
                <input id="customerName" placeholder="Customer name" />
                <input id="customerPhone" placeholder="Phone number" />
                <input id="deliveryAddress" placeholder="Delivery address" />
                <select id="paymentMethod">
                    <option value="Cash on Delivery">Cash on Delivery</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Card</option>
                </select>
                <button class="place-btn" onclick="placeOrder()">Place Order</button>
            </div>
        </aside>
    </div>

    <section class="panel" style="margin-top:24px;">
        <h2>Recent Orders</h2>
        <div class="order-list" id="ordersList"></div>
    </section>
</div>

<script>
    const cart = [];

    async function loadFoods() {
        const response = await fetch('/api/foods');
        const foods = await response.json();
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';

        foods.forEach(food => {
            const card = document.createElement('div');
            card.className = 'food-card';
            card.innerHTML = `
                <div class="food-image">🍽️</div>
                <div class="food-name">${food.name}</div>
                <div class="food-meta">
                    <span>${food.category}</span>
                    <span class="price">₹${food.price}</span>
                </div>
                <button class="add-btn" onclick="addToCart(${food.id}, '${food.name}', ${food.price})">Add to Cart</button>
            `;
            grid.appendChild(card);
        });
    }

    function addToCart(foodId, name, price) {
        const existing = cart.find(item => item.foodId === foodId);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ foodId, name, price, quantity: 1 });
        }
        renderCart();
    }

    function updateQuantity(foodId, delta) {
        const item = cart.find(i => i.foodId === foodId);
        if (!item) return;
        item.quantity += delta;
        if (item.quantity <= 0) {
            const idx = cart.findIndex(i => i.foodId === foodId);
            cart.splice(idx, 1);
        }
        renderCart();
    }

    function renderCart() {
        const cartList = document.getElementById('cartList');
        cartList.innerHTML = '';
        let total = 0;

        if (cart.length === 0) {
            cartList.innerHTML = '<li class="muted">Your cart is empty.</li>';
        } else {
            cart.forEach(item => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <div>
                        <strong>${item.name}</strong>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQuantity(${item.foodId}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${item.foodId}, 1)">+</button>
                        </div>
                    </div>
                    <strong>₹${item.price * item.quantity}</strong>
                `;
                cartList.appendChild(li);
                total += item.price * item.quantity;
            });
        }

        document.getElementById('totalPrice').textContent = '₹' + total;
    }

    async function placeOrder() {
        if (cart.length === 0) {
            alert('Please add at least one item to the cart.');
            return;
        }

        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const address = document.getElementById('deliveryAddress').value.trim();
        const paymentMethod = document.getElementById('paymentMethod').value;

        if (!name || !phone || !address) {
            alert('Please fill in customer name, phone number, and delivery address.');
            return;
        }

        const order = {
            customerName: name,
            phoneNumber: phone,
            deliveryAddress: address,
            paymentMethod: paymentMethod,
            items: cart.map(item => ({
                foodItem: { id: item.foodId },
                quantity: item.quantity
            }))
        };

        const response = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(order)
        });

        if (response.ok) {
            cart.length = 0;
            renderCart();
            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('deliveryAddress').value = '';
            await loadOrders();
            alert('Order placed successfully!');
        } else {
            alert('Unable to place order.');
        }
    }

    async function loadOrders() {
        const response = await fetch('/api/orders');
        const orders = await response.json();
        const list = document.getElementById('ordersList');
        list.innerHTML = '';

        if (!orders.length) {
            list.innerHTML = '<div class="muted">No recent orders yet.</div>';
            return;
        }

        orders.slice().reverse().forEach(order => {
            const row = document.createElement('div');
            row.className = 'order-item';
            row.innerHTML = `
                <div class="order-head">
                    <strong>${order.customerName}</strong>
                    <span class="tag">${order.status}</span>
                </div>
                <div class="muted">Phone: ${order.phoneNumber}</div>
                <div class="muted">Address: ${order.deliveryAddress}</div>
                <div class="muted">Items: ${order.items ? order.items.length : 0}</div>
                <div style="margin-top:8px; font-weight:700;">Total: ₹${order.totalAmount}</div>
            `;
            list.appendChild(row);
        });
    }

    loadFoods();
    renderCart();
    loadOrders();
</script>
</body>
</html>
